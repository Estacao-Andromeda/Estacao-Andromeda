- type: entity
  parent: BaseMobHuman
  name: Urist McOni
  id: MobOniBase
  abstract: true
  components:
  - type: Speech
    speechSounds: Baritone
  - type: HumanoidAppearance
    species: Oni
  - type: Sprite
    scale: 1.2, 1.2
  - type: PlayerToolModifier
    pryTimeMultiplier: 0.5
  - type: PlayerAccuracyModifier
    spreadMultiplier: 15
    maxSpreadAngle: 180
  - type: BonusMeleeDamage
    damageModifierSet:
      coefficients:
        Blunt: 1.3
        Slash: 1.3
        Piercing: 1.3
        Asphyxiation: 1.3
        Structural: 1.3
  - type: ClothingSlowResistance
    modifier: 0.15 # Slowdowns incurred by worn clothing are 15% less effective.
  - type: Damageable
    damageModifierSet: Oni
  - type: Body
    prototype: Oni
  - type: LightweightDrunk
    boozeStrengthMultiplier: 0.5 # REAL hard to get drunk
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.42
        density: 275
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Stamina
    critThreshold: 115
  - type: TypingIndicator
    proto: oni

- type: entity
  save: false
  name: Urist McOni
  parent: MobHumanDummy
  id: MobOniDummy
  categories: [ HideSpawnMenu ]
  description: A dummy oni meant to be used in character setup.
