- type: entity
  id: PartOni
  parent: [BaseItem, BasePart]
  name: "oni body part"
  abstract: true
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 4
      - ReagentId: Blood
        Quantity: 12

