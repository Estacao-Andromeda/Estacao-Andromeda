- type: reagent
  id: Anodynafil
  name: reagent-name-anodynafil
  desc: reagent-desc-anodynafil
  flavor: tingly
  color: "#8FABA3"
  physicalDesc: reagent-physical-desc-sticky
  group: Medicine
  metabolisms:
    Medicine:
      effects:
      - !type:GenericStatusEffect
        key: Anesthesia
        component: Anesthesia
        refresh: false
        time: 4.0
        type: Add
      - !type:GenericStatusEffect
        key: PainNumbness
        component: PainNumbness
        refresh: false
        time: 8.0
        type: Add
      - !type:MovespeedModifier
        walkSpeedModifier: 0.5
        sprintSpeedModifier: 0.5

- type: reagent
  id: Umbroxol
  name: reagent-name-umbroxol
  group: Medicine
  desc: reagent-desc-umbroxol
  physicalDesc: reagent-physical-desc-dark
  flavor: medicine
  color: "#211f3d"
  worksOnTheDead: true
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        damage:
          types:
            Holy: -2
      - !type:AdjustTemperature
        amount: -12000 # Funkychem
      - !type:HealthChange
        conditions:
          - !type:ReagentThreshold
            min: 15
        damage:
          types:
            Cold: 2
      - !type:AdjustTemperature
        conditions:
          - !type:ReagentThreshold
            min: 15
        amount: -24000
      - !type:Jitter
        conditions:
          - !type:ReagentThreshold
            min: 15

